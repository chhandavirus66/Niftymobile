name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.0"

      - name: Install Flet
        run: pip install flet==0.24.1

      - name: Prepare entry point (flet expects main.py)
        run: cp nifty_mobile_app.py main.py

      - name: Build APK
        run: |
          flet build apk \
            --project "nifty-quant" \
            --product "Nifty Pro Quant" \
            --org com.niftyquant \
            --build-version 18.8 \
            --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nifty-quant-apk
          path: build/apk/*.apk
